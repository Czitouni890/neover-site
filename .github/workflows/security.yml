name: Security and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - name: Audit runtime and development dependencies
        run: npm run security:audit

  tests:
    name: Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
      NPM_CONFIG_FETCH_RETRIES: 2
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 5000
      NPM_CONFIG_FETCH_TIMEOUT: 20000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:antispam
      - run: npm run test:audience
      - run: npm run test:images
      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: preview-ui/*.png
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  notify-failure:
    name: Notify persistent failure
    needs: [audit, tests]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.audit.result == 'failure' || needs.tests.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: security-failure-notification-main
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Open a single issue for investigation
        run: node scripts/notify-security-failure.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
