services:
  - type: web
    name: neover-site
    runtime: node
    plan: free
    buildCommand: npm ci && npm run security:check
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTACT_WEBHOOK_URL
        value: https://formspree.io/f/xbgdwbvw
